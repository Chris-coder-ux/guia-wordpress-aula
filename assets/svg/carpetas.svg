<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="car-t car-d" font-family="Segoe UI, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="car-t">Crear una carpeta y mover un archivo dentro</title>
  <desc id="car-d">Cuatro ventanas del Explorador de Windows muestran cómo crear una carpeta en Documentos, ponerle nombre, cortar un archivo en Descargas y pegarlo dentro de la carpeta.</desc>

