      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#e8efed"/>
    </linearGradient>
    <linearGradient id="des-pelaje" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#dce8e3"/>
      <stop offset="1" stop-color="#b9cbc4"/>
    </linearGradient>
    <filter id="des-sombra" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173b34" flood-opacity=".16"/>
    </filter>
    <filter id="des-sombra-menu" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173b34" flood-opacity=".18"/>
    </filter>
    <clipPath id="des-recorte-1">
