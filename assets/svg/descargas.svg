<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="des-t des-d" font-family="Segoe UI, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="des-t">Descargar una imagen y encontrarla en la carpeta Descargas</title>
  <desc id="des-d">Tres ventanas en fila muestran cómo guardar una imagen de un gato desde el navegador y localizarla después en la carpeta Descargas.</desc>

  <defs>
