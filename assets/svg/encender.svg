<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="enc-t enc-d">
  <title id="enc-t">Encender el ordenador</title>
  <desc id="enc-d">Guía visual completada para encender un ordenador de sobremesa y comprobar que aparece el escritorio.</desc>
  <defs>
    <linearGradient id="enc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3f7"/>
      <stop offset="1" stop-color="#dce7ee"/>
    </linearGradient>
    <linearGradient id="enc-screenWall" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4f9bd0"/>
      <stop offset=".55" stop-color="#3676b0"/>
      <stop offset="1" stop-color="#253f78"/>
    </linearGradient>
    <linearGradient id="enc-deskGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf0f3"/>
      <stop offset="1" stop-color="#cbd7dc"/>
    </linearGradient>
    <linearGradient id="enc-caseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34414b"/>
      <stop offset=".45" stop-color="#202a32"/>
      <stop offset="1" stop-color="#131b22"/>
    </linearGradient>
    <filter id="enc-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="enc-softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="enc-screenClip"><rect x="658" y="181" width="557" height="350" rx="8"/></clipPath>
  </defs>

  <rect width="1440" height="900" fill="url(#enc-bg)"/>
  <circle cx="1350" cy="110" r="190" fill="#fff" opacity=".25"/>
  <circle cx="135" cy="810" r="230" fill="#fff" opacity=".23"/>

  <rect x="44" y="42" width="1352" height="816" rx="30" fill="#f8fafb" filter="url(#enc-shadow)"/>

  <!-- Instruction card -->
  <rect x="72" y="72" width="508" height="756" rx="22" fill="#fff" stroke="#e4ebef"/>
  <text x="108" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#6a7f8c">GUÍA RÁPIDA</text>
  <text x="108" y="190" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1d2d39">Encender el</text>
  <text x="108" y="234" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1d2d39">ordenador</text>
  <rect x="108" y="255" width="118" height="36" rx="18" fill="#e4f5ec"/>
  <circle cx="128" cy="273" r="9" fill="#2ba66a"/>
  <path d="M123 273l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#218453">Hecho</text>

  <line x1="130" y1="327" x2="130" y2="746" stroke="#dce5e9" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="130" cy="337" r="20" fill="#256b91"/>
  <text x="130" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="166" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#243744">Busca el botón de encendido</text>
  <text x="166" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">En la torre del PC o en el lateral/</text>
  <text x="166" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">teclado del portátil. Tiene el símbolo</text>
  <text x="166" y="397" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#256b91">⏻</text>

  <!-- Step 2 -->
  <circle cx="130" cy="435" r="20" fill="#256b91"/>
  <text x="130" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="166" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#243744">Púlsalo una vez y quita la mano.</text>
  <text x="166" y="453" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">No hace falta mantenerlo pulsado.</text>

  <!-- Step 3 -->
  <circle cx="130" cy="511" r="20" fill="#256b91"/>
  <text x="130" y="517" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="166" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#243744">Espera a que arranque.</text>
  <text x="166" y="529" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">Puede tardar un minuto.</text>
  <rect x="166" y="543" width="241" height="27" rx="13.5" fill="#fff3e7"/>
  <path d="M180 551v6l4 2" fill="none" stroke="#d98232" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="180" cy="556" r="8" fill="none" stroke="#d98232" stroke-width="1.5"/>
  <text x="196" y="561" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#a75d20">No lo pulses varias veces</text>

  <!-- Step 4 -->
  <circle cx="130" cy="621" r="20" fill="#256b91"/>
  <text x="130" y="627" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="166" y="615" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#243744">Si pide contraseña, escríbela</text>
  <text x="166" y="639" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">y pulsa Enter.</text>

  <!-- Step 5 -->
  <circle cx="130" cy="713" r="20" fill="#2ba66a"/>
  <path d="M123 713l4.5 4.5 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="166" y="706" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#243744">Comprueba que aparece el escritorio:</text>
  <text x="166" y="730" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#526773">la pantalla con iconos y la franja de abajo.</text>

  <!-- Computer scene -->
  <rect x="605" y="76" width="761" height="721" rx="22" fill="#f1f5f7"/>
  <text x="642" y="119" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#6f8490">EL ORDENADOR YA ESTÁ ENCENDIDO</text>

  <!-- Desk -->
  <ellipse cx="1012" cy="713" rx="345" ry="35" fill="#526875" opacity=".12"/>
  <path d="M627 680h711v52c0 16-13 29-29 29H656c-16 0-29-13-29-29z" fill="url(#enc-deskGlow)"/>
  <path d="M627 680h711v9H627z" fill="#b8c8cf"/>

  <!-- Monitor frame -->
  <g filter="url(#enc-softShadow)">
    <rect x="640" y="161" width="593" height="395" rx="16" fill="#202a31"/>
    <rect x="650" y="171" width="573" height="370" rx="11" fill="#0f171d"/>
  </g>
  <g clip-path="url(#enc-screenClip)">
    <rect x="658" y="181" width="557" height="350" fill="url(#enc-screenWall)"/>
    <!-- soft desktop wallpaper landscape -->
    <circle cx="1086" cy="267" r="47" fill="#f5d88c" opacity=".85"/>
    <path d="M658 401c94-76 154-61 232-14 61-57 133-85 216-27 42-30 77-28 109-5v176H658z" fill="#5a9c98"/>
    <path d="M658 433c96-42 166-29 245 11 74-41 151-57 236-13 25-12 49-16 76-10v110H658z" fill="#317d79"/>
    <path d="M658 481c116-39 206-23 287 10 79-28 160-30 270 0v40H658z" fill="#245e68"/>
    <!-- desktop icons -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff" text-anchor="middle">
      <rect x="674" y="199" width="25" height="22" rx="3" fill="#edf6ff" opacity=".95"/>
      <path d="M680 205h13v11h-13z" fill="#559bd0"/><path d="M680 205l6.5 6 6.5-6" fill="none" stroke="#fff" stroke-width="1"/>
      <text x="687" y="234">Archivos</text>
      <rect x="674" y="249" width="25" height="22" rx="3" fill="#f6df85"/>
      <path d="M679 256h15v10h-15z" fill="#e9bd4b"/>
      <text x="687" y="284">Carpeta</text>
      <rect x="674" y="299" width="25" height="22" rx="4" fill="#e9f2ff"/>
      <circle cx="686.5" cy="310" r="8" fill="#5c8bd7"/><path d="M682 310h9m-4.5-4.5v9" stroke="#fff" stroke-width="1.5"/>
      <text x="687" y="334">Navegador</text>
      <rect x="674" y="349" width="25" height="22" rx="4" fill="#f7f7f7"/>
      <path d="M680 354h13v12h-13z" fill="#52a3a0"/><path d="M682 358h9m-9 3h7" stroke="#fff" stroke-width="1"/>
      <text x="687" y="384">Papelera</text>
    </g>
    <!-- bottom taskbar -->
    <rect x="658" y="506" width="557" height="25" fill="#101b25" opacity=".94"/>
    <circle cx="676" cy="518.5" r="7" fill="#78b9f5"/>
    <path d="M673 515h6v7h-6z" fill="#fff" opacity=".9"/>
    <rect x="693" y="512" width="167" height="13" rx="6.5" fill="#263746"/>
    <circle cx="706" cy="518.5" r="3" fill="none" stroke="#a9bdc9" stroke-width="1"/>
    <path d="M709 521l3 3" stroke="#a9bdc9" stroke-width="1"/>
    <text x="719" y="522" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#b8c6ce">Buscar</text>
    <g transform="translate(881 511)">
      <rect width="14" height="14" rx="3" fill="#4d9de0"/>
      <path d="M7 2v10M2 7h10" stroke="#fff" stroke-width="1.4"/>
      <rect x="906" width="14" height="14" rx="3" fill="#e3b94b"/>
      <path d="M909 4h8v7h-8z" fill="#fff" opacity=".9"/>
      <rect x="931" width="14" height="14" rx="3" fill="#dd6e62"/>
      <path d="M934 4h8v7h-8z" fill="none" stroke="#fff" stroke-width="1"/>
    </g>
    <path d="M1170 516h9m-7-3 7 3-7 3" fill="none" stroke="#d4e0e5" stroke-width="1"/>
    <text x="1199" y="521" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#eef3f5">10:42</text>
  </g>
  <circle cx="936" cy="548" r="3" fill="#45c391"/>
  <!-- monitor stand -->
  <path d="M895 556h83l14 102H882z" fill="#aebbc2"/>
  <path d="M906 556h60l5 14h-70z" fill="#c6d0d5"/>
  <path d="M835 656q0-10 12-10h180q12 0 12 10v12H835z" fill="#56646c"/>
  <path d="M847 656h180" stroke="#87969d" stroke-width="2"/>

  <!-- Tower -->
  <g filter="url(#enc-softShadow)">
    <rect x="1216" y="299" width="112" height="366" rx="13" fill="url(#enc-caseGrad)"/>
    <path d="M1226 312h92v338h-92z" fill="#26323a"/>
    <path d="M1231 322h6v315h-6z" fill="#3a4851" opacity=".9"/>
    <rect x="1247" y="324" width="65" height="5" rx="2.5" fill="#172128"/>
    <rect x="1247" y="337" width="65" height="5" rx="2.5" fill="#172128"/>
    <rect x="1247" y="350" width="65" height="5" rx="2.5" fill="#172128"/>
    <circle cx="1282" cy="394" r="11" fill="#131c22" stroke="#758791" stroke-width="1.5"/>
    <circle cx="1282" cy="394" r="7" fill="#2b3a43"/>
    <path d="M1282 387v7m-4.6-2.3a5.2 5.2 0 1 0 9.2 0" fill="none" stroke="#65d7ae" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1306" cy="394" r="2.5" fill="#4ca7d8"/>
    <path d="M1247 437h65v2h-65zM1247 446h65v2h-65zM1247 455h65v2h-65z" fill="#172128"/>
    <path d="M1249 478h61v154h-61z" fill="#202b33"/>
    <path d="M1254 485h51v1h-51zM1254 493h51v1h-51zM1254 501h51v1h-51zM1254 509h51v1h-51zM1254 517h51v1h-51zM1254 525h51v1h-51zM1254 533h51v1h-51zM1254 541h51v1h-51zM1254 549h51v1h-51zM1254 557h51v1h-51zM1254 565h51v1h-51zM1254 573h51v1h-51zM1254 581h51v1h-51zM1254 589h51v1h-51zM1254 597h51v1h-51zM1254 605h51v1h-51zM1254 613h51v1h-51zM1254 621h51v1h-51z" fill="#35434b"/>
  </g>
  <rect x="1288" y="665" width="20" height="5" rx="2" fill="#404d54"/>

  <!-- Keyboard and mouse -->
  <g filter="url(#enc-softShadow)">
    <path d="M741 675h396q12 0 9 10l-11 38q-2 7-11 7H747q-9 0-11-8l-8-37q-2-10 13-10z" fill="#343f46"/>
    <path d="M752 683h375l-4 7H755z" fill="#53616a"/>
    <g stroke="#89979d" stroke-width="1" opacity=".8">
      <path d="M758 695h365M761 704h359M763 713h354"/>
      <path d="M777 689v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29m25-29v29"/>
    </g>
    <path d="M889 723h106" stroke="#849199" stroke-width="2"/>
    <path d="M1168 685c0-12 9-21 20-21s20 9 20 21v28c0 11-9 20-20 20s-20-9-20-20z" fill="#3b474f"/>
    <path d="M1188 665v19" stroke="#849199" stroke-width="1.5"/>
  </g>

  <!-- power button callout -->
  <path d="M1282 406v62h-63v15" fill="none" stroke="#e29a48" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="1034" y="477" width="185" height="34" rx="17" fill="#fff" stroke="#f0d5b5"/>
  <circle cx="1063" cy="494" r="11" fill="#fff2e3"/>
  <path d="M1063 488v6m-4-2a4.6 4.6 0 1 0 8 0" fill="none" stroke="#cf7c2f" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1080" y="499" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#8b5728">Botón de encendido</text>

  <!-- desktop confirmation label -->
  <rect x="676" y="581" width="192" height="33" rx="16.5" fill="#e6f6ed"/>
  <circle cx="695" cy="597.5" r="8" fill="#2ba66a"/>
  <path d="M691 597l2.5 2.5 5-5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="711" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#218453">Escritorio visible</text>
</svg>
