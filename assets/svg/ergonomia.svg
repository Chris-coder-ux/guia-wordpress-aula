<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="erg-t erg-d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="erg-t">Cuidar el cuerpo: postura, pies apoyados y descanso de la vista</title>
  <desc id="erg-d">Tres paneles de ergonomía con ilustraciones profesionales. Panel 1: alineación de la vista con el tercio superior de la pantalla. Panel 2: ángulos de 90° en cadera, rodillas y tobillos con apoyo lumbar. Panel 3: regla 20-20-20 para descanso visual y movilidad de muñecas.</desc>

  <defs>
    <!-- Sombras suaves y profesionales -->
    <filter id="shadow-soft" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A2B3C" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-medium" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A2B3C" flood-opacity="0.12"/>
    </filter>

    <!-- Gradientes de materiales y piel -->
    <linearGradient id="grad-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF9F6"/>
      <stop offset="1" stop-color="#F0EDE8"/>
    </linearGradient>
    <linearGradient id="grad-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E2D9"/>
      <stop offset="1" stop-color="#D8D0C5"/>
    </linearGradient>
    <linearGradient id="grad-skin" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F5D5B8"/>
      <stop offset="1" stop-color="#E5B99A"/>
    </linearGradient>
    <linearGradient id="grad-skin-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5B99A"/>
      <stop offset="1" stop-color="#D4A585"/>
    </linearGradient>
    <linearGradient id="grad-shirt" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5B8C85"/>
      <stop offset="1" stop-color="#416B65"/>
    </linearGradient>
    <linearGradient id="grad-pants" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3D405B"/>
      <stop offset="1" stop-color="#2A2D42"/>
    </linearGradient>
    <linearGradient id="grad-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D5C0"/>
      <stop offset="0.4" stop-color="#D4BCA0"/>
      <stop offset="1" stop-color="#C4A888"/>
    </linearGradient>
    <linearGradient id="grad-chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A5568"/>
      <stop offset="1" stop-color="#2D3748"/>
    </linearGradient>
    <linearGradient id="grad-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F7FA"/>
      <stop offset="1" stop-color="#D6E8F0"/>
    </linearGradient>
    <linearGradient id="grad-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D8EA"/>
      <stop offset="1" stop-color="#D4E8F0"/>
    </linearGradient>

    <!-- Clip paths para los paneles -->
    <clipPath id="clip-panel"><rect width="350" height="740" rx="20"/></clipPath>
    
    <!-- Marcador de ángulo 90 grados elegante -->
    <path id="icon-90" d="M0,12 A12,12 0 0,1 12,0 L12,4 A8,8 0 0,0 4,4 L4,12 Z" fill="#0b6b52" opacity="0.9"/>
  </defs>

  <!-- Fondo general -->
  <rect width="1200" height="880" fill="#F4F1EA"/>

  <!-- ================= PANEL 1: ALTURA DE PANTALLA ================= -->
  <g transform="translate(60, 70)">
    <rect width="350" height="740" rx="20" fill="#FFFFFF" filter="url(#shadow-soft)"/>
    <g clip-path="url(#clip-panel)">
      <!-- Entorno -->
      <rect width="350" height="500" fill="url(#grad-wall)"/>
      <path d="M0,500 L350,500 L350,740 L0,740 Z" fill="url(#grad-floor)"/>
      <rect y="500" width="350" height="4" fill="#C4B8A8"/>

      <!-- Escritorio -->
      <rect x="130" y="420" width="220" height="16" rx="4" fill="url(#grad-desk)" filter="url(#shadow-medium)"/>
      <rect x="145" y="436" width="12" height="140" fill="#B89A78"/>
      <rect x="325" y="436" width="12" height="140" fill="#B89A78"/>

      <!-- Monitor moderno -->
      <rect x="200" y="260" width="130" height="90" rx="6" fill="#2D3748" filter="url(#shadow-medium)"/>
      <rect x="205" y="265" width="120" height="80" rx="2" fill="url(#grad-screen)"/>
      <!-- Contenido pantalla -->
      <rect x="215" y="275" width="40" height="4" rx="2" fill="#5B8C85" opacity="0.6"/>
      <rect x="215" y="285" width="80" height="3" rx="1.5" fill="#A0C4D4" opacity="0.5"/>
      <rect x="215" y="293" width="60" height="3" rx="1.5" fill="#A0C4D4" opacity="0.5"/>
      <rect x="215" y="305" width="100" height="30" rx="4" fill="#FFFFFF" opacity="0.7"/>
      <!-- Base monitor -->
      <path d="M255,350 L260,370 L280,370 L285,350 Z" fill="#4A5568"/>
      <ellipse cx="270" cy="372" rx="22" ry="5" fill="#2D3748" opacity="0.2"/>

      <!-- Silla ergonómica -->
      <g transform="translate(60, 340)">
        <!-- Respaldo -->
        <path d="M10,0 Q5,60 10,110 L40,110 Q45,60 40,0 Z" fill="url(#grad-chair)" filter="url(#shadow-medium)"/>
        <path d="M15,40 Q25,45 35,40" stroke="#718096" stroke-width="2" fill="none" opacity="0.5"/>
        <!-- Asiento -->
        <path d="M5,110 Q0,125 10,130 L55,130 Q65,125 60,110 Z" fill="#2D3748"/>
        <!-- Base -->
        <rect x="30" y="130" width="10" height="40" fill="#4A5568"/>
        <path d="M15,170 L55,170 L65,180 L5,180 Z" fill="#2D3748"/>
        <circle cx="15" cy="182" r="4" fill="#1A202C"/>
        <circle cx="55" cy="182" r="4" fill="#1A202C"/>
      </g>

      <!-- Persona (Anatomía mejorada) -->
      <g transform="translate(85, 200)">
        <!-- Piernas -->
        <!-- Muslo -->
        <path d="M25,220 L115,220 Q125,220 125,230 L125,235 Q125,245 115,245 L25,245 Q15,245 15,235 L15,230 Q15,220 25,220 Z" fill="url(#grad-pants)"/>
        <!-- Pantorrilla -->
        <path d="M115,235 L115,315 Q115,325 125,325 L130,325 Q140,325 140,315 L140,310 Q140,300 130,300 L125,300 L125,235 Z" fill="url(#grad-pants)"/>
        <!-- Pie/Zapato -->
        <path d="M120,315 L155,315 Q165,315 165,325 L165,330 Q165,338 155,338 L120,338 Q115,338 115,330 L115,325 Q115,315 120,315 Z" fill="#2D3748"/>

        <!-- Torso -->
        <path d="M20,100 Q15,160 20,220 L65,220 Q70,160 65,100 Q42,90 20,100 Z" fill="url(#grad-shirt)"/>
        <!-- Cuello -->
        <path d="M35,85 L35,105 Q42,110 50,105 L50,85 Z" fill="url(#grad-skin)"/>
        <!-- Cabeza (Perfil) -->
        <path d="M42,40 Q30,40 25,55 Q20,75 30,85 Q40,95 55,90 Q65,85 65,70 Q65,50 55,42 Q48,38 42,40 Z" fill="url(#grad-skin)"/>
        <!-- Cabello -->
        <path d="M28,50 Q25,35 40,30 Q55,28 62,40 Q65,50 60,60 L55,55 Q50,45 40,45 Q32,45 30,55 Z" fill="#3D2C22"/>
        <!-- Ojo y detalle facial -->
        <circle cx="52" cy="62" r="2" fill="#2D3748"/>
        <path d="M58,72 Q62,74 64,72" stroke="#C49A7A" stroke-width="1" fill="none"/>

        <!-- Brazo -->
        <path d="M30,110 Q25,160 30,200" stroke="url(#grad-shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path d="M30,200 L90,200" stroke="url(#grad-skin)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <!-- Mano -->
        <ellipse cx="95" cy="200" rx="10" ry="7" fill="url(#grad-skin)"/>
      </g>

      <!-- Teclado -->
      <rect x="160" y="405" width="80" height="14" rx="4" fill="#E2E8F0" filter="url(#shadow-medium)"/>
      <line x1="168" y1="410" x2="232" y2="410" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
      <line x1="168" y1="415" x2="220" y2="415" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>

      <!-- Anotaciones ergonómicas -->
      <!-- Línea de visión -->
      <line x1="135" y1="262" x2="205" y2="262" stroke="#0b6b52" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
      <circle cx="135" cy="262" r="3" fill="#0b6b52"/>
      <circle cx="205" cy="262" r="3" fill="#0b6b52"/>
      <text x="170" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#0b6b52">Nivel de los ojos</text>

      <!-- Ángulos 90° -->
      <use href="#icon-90" x="105" y="290" transform="rotate(90, 115, 300)"/>
      <use href="#icon-90" x="195" y="305"/>
      <use href="#icon-90" x="225" y="425" transform="rotate(180, 235, 435)"/>
    </g>

    <!-- Encabezado Panel 1 -->
    <circle cx="30" cy="30" r="16" fill="#0b6b52"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="56" y="26" font-size="13" font-weight="700" fill="#2D3748">Pantalla a la altura</text>
    <text x="56" y="42" font-size="13" font-weight="700" fill="#2D3748">de los ojos</text>
    <text x="175" y="710" text-anchor="middle" font-size="11" fill="#718096">El tercio superior de la pantalla debe coincidir con la mirada</text>
  </g>

  <!-- ================= PANEL 2: ESPALDA Y PIES ================= -->
  <g transform="translate(425, 70)">
    <rect width="350" height="740" rx="20" fill="#FFFFFF" filter="url(#shadow-soft)"/>
    <g clip-path="url(#clip-panel)">
      <!-- Entorno -->
      <rect width="350" height="450" fill="url(#grad-wall)"/>
      <path d="M0,450 L350,450 L350,740 L0,740 Z" fill="url(#grad-floor)"/>
      <rect y="450" width="350" height="4" fill="#C4B8A8"/>

      <!-- Silla (Detalle lumbar) -->
      <g transform="translate(50, 300)">
        <!-- Respaldo con curva lumbar -->
        <path d="M15,0 Q5,50 10,100 Q15,140 30,150 L50,150 Q65,140 70,100 Q75,50 65,0 Z" fill="url(#grad-chair)" filter="url(#shadow-medium)"/>
        <!-- Apoyo lumbar destacado -->
        <path d="M20,90 Q40,105 60,90" stroke="#0b6b52" stroke-width="3" fill="none" opacity="0.6"/>
        <!-- Asiento -->
        <path d="M10,150 Q0,165 15,170 L85,170 Q100,165 90,150 Z" fill="#2D3748"/>
        <!-- Base -->
        <rect x="45" y="170" width="12" height="50" fill="#4A5568"/>
        <path d="M20,220 L80,220 L95,232 L5,232 Z" fill="#2D3748"/>
        <circle cx="20" cy="234" r="5" fill="#1A202C"/>
        <circle cx="80" cy="234" r="5" fill="#1A202C"/>
      </g>

      <!-- Persona (Zoom en postura) -->
      <g transform="translate(80, 220)">
        <!-- Torso y Cadera -->
        <path d="M25,20 Q15,80 20,150 Q25,180 40,190 L80,190 Q95,180 100,150 Q105,80 95,20 Q60,10 25,20 Z" fill="url(#grad-shirt)"/>
        <!-- Cuello -->
        <path d="M50,5 L50,25 Q60,30 70,25 L70,5 Z" fill="url(#grad-skin)"/>
        <!-- Cabeza (Perfil parcial) -->
        <path d="M55,-30 Q40,-30 35,-15 Q30,5 40,15 Q50,25 65,20 Q75,15 75,0 Q75,-20 65,-28 Q58,-32 55,-30 Z" fill="url(#grad-skin)"/>
        <path d="M38,-20 Q35,-35 50,-40 Q65,-38 72,-25 Q75,-15 70,-5 L65,-10 Q60,-20 50,-20 Q42,-20 40,-15 Z" fill="#3D2C22"/>

        <!-- Pierna (Muslo) -->
        <path d="M30,180 L140,180 Q155,180 155,195 L155,205 Q155,220 140,220 L30,220 Q15,220 15,205 L15,195 Q15,180 30,180 Z" fill="url(#grad-pants)"/>
        <!-- Pierna (Pantorrilla) -->
        <path d="M140,205 L140,310 Q140,325 155,325 L165,325 Q180,325 180,310 L180,300 Q180,285 165,285 L155,285 L155,205 Z" fill="url(#grad-pants)"/>
        <!-- Pie -->
        <path d="M145,310 L190,310 Q205,310 205,325 L205,335 Q205,345 190,345 L145,345 Q135,345 135,335 L135,325 Q135,310 145,310 Z" fill="#2D3748"/>
      </g>

      <!-- Anotaciones -->
      <!-- Cadera 90° -->
      <path d="M110,385 A25,25 0 0,1 135,360" fill="none" stroke="#0b6b52" stroke-width="2"/>
      <text x="145" y="370" font-size="11" font-weight="700" fill="#0b6b52">90°</text>
      
      <!-- Rodilla 90° -->
      <path d="M220,385 A25,25 0 0,1 245,410" fill="none" stroke="#0b6b52" stroke-width="2"/>
      <text x="255" y="405" font-size="11" font-weight="700" fill="#0b6b52">90°</text>

      <!-- Tobillo 90° -->
      <path d="M220,515 A20,20 0 0,1 240,535" fill="none" stroke="#0b6b52" stroke-width="2"/>
      <text x="245" y="530" font-size="11" font-weight="700" fill="#0b6b52">90°</text>

      <!-- Línea de espalda apoyada -->
      <path d="M100,300 Q95,380 100,420" fill="none" stroke="#0b6b52" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="60" y="360" font-size="11" font-weight="600" fill="#0b6b52" transform="rotate(-80, 60, 360)">Espalda apoyada</text>

      <!-- Línea de pies apoyados -->
      <line x1="280" y1="540" x2="250" y2="540" stroke="#0b6b52" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="285" y="544" font-size="11" font-weight="600" fill="#0b6b52">Pies planos en el suelo</text>
    </g>

    <!-- Encabezado Panel 2 -->
    <circle cx="30" cy="30" r="16" fill="#0b6b52"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="56" y="26" font-size="13" font-weight="700" fill="#2D3748">Espalda y pies</text>
    <text x="56" y="42" font-size="13" font-weight="700" fill="#2D3748">bien apoyados</text>
    <text x="175" y="710" text-anchor="middle" font-size="11" fill="#718096">Mantén ángulos de 90° y busca soporte lumbar</text>
  </g>

  <!-- ================= PANEL 3: DESCANSO VISUAL ================= -->
  <g transform="translate(790, 70)">
    <rect width="350" height="740" rx="20" fill="#FFFFFF" filter="url(#shadow-soft)"/>
    <g clip-path="url(#clip-panel)">
      <!-- Entorno -->
      <rect width="350" height="500" fill="url(#grad-wall)"/>
      <path d="M0,500 L350,500 L350,740 L0,740 Z" fill="url(#grad-floor)"/>
      <rect y="500" width="350" height="4" fill="#C4B8A8"/>

      <!-- Ventana -->
      <g transform="translate(180, 60)">
        <rect width="140" height="160" rx="6" fill="#4A5568" filter="url(#shadow-medium)"/>
        <rect x="6" y="6" width="128" height="148" rx="2" fill="url(#grad-window)"/>
        <!-- Paisaje exterior estilizado -->
        <path d="M6,120 Q40,90 70,110 Q100,130 134,100 L134,154 L6,154 Z" fill="#81B29A" opacity="0.8"/>
        <path d="M6,130 Q50,110 80,125 Q110,140 134,120 L134,154 L6,154 Z" fill="#6A997C" opacity="0.9"/>
        <circle cx="110" cy="40" r="16" fill="#F2CC8F" opacity="0.9"/>
        <path d="M30,40 Q40,25 55,35 Q70,25 80,40 Q70,55 55,50 Q40,55 30,40 Z" fill="#FFFFFF" opacity="0.7"/>
        <!-- Marco ventana -->
        <line x1="70" y1="6" x2="70" y2="154" stroke="#4A5568" stroke-width="3"/>
        <line x1="6" y1="80" x2="134" y2="80" stroke="#4A5568" stroke-width="3"/>
      </g>

      <!-- Escritorio y Monitor (Fondo) -->
      <rect x="20" y="380" width="140" height="14" rx="4" fill="url(#grad-desk)" filter="url(#shadow-medium)"/>
      <rect x="35" y="394" width="10" height="120" fill="#B89A78"/>
      
      <g transform="translate(40, 240)">
        <rect width="100" height="70" rx="4" fill="#2D3748"/>
        <rect x="4" y="4" width="92" height="62" rx="2" fill="url(#grad-screen)"/>
        <!-- Pantalla de pausa -->
        <text x="50" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0b6b52">45:00</text>
        <text x="50" y="48" text-anchor="middle" font-size="9" font-weight="600" fill="#718096">PAUSA ACTIVA</text>
        <path d="M45,60 L50,60 L50,55" stroke="#0b6b52" stroke-width="2" fill="none"/>
      </g>

      <!-- Silla -->
      <g transform="translate(30, 320)">
        <path d="M10,0 Q5,50 10,90 L35,90 Q40,50 35,0 Z" fill="url(#grad-chair)"/>
        <path d="M5,90 Q0,105 10,110 L50,110 Q60,105 55,90 Z" fill="#2D3748"/>
        <rect x="25" y="110" width="10" height="40" fill="#4A5568"/>
        <path d="M10,150 L50,150 L60,160 L0,160 Z" fill="#2D3748"/>
      </g>

      <!-- Persona (Mirando a la ventana) -->
      <g transform="translate(55, 200)">
        <!-- Torso (ligeramente girado) -->
        <path d="M20,80 Q15,140 20,200 L60,200 Q65,140 60,80 Q40,70 20,80 Z" fill="url(#grad-shirt)"/>
        <!-- Cuello -->
        <path d="M35,65 L35,85 Q42,90 50,85 L50,65 Z" fill="url(#grad-skin)"/>
        <!-- Cabeza (Girada hacia la derecha) -->
        <path d="M40,25 Q25,25 20,40 Q15,60 25,70 Q35,80 50,75 Q60,70 60,55 Q60,35 50,27 Q45,23 40,25 Z" fill="url(#grad-skin)"/>
        <path d="M23,35 Q20,20 35,15 Q50,13 57,25 Q60,35 55,45 L50,40 Q45,30 35,30 Q27,30 25,40 Z" fill="#3D2C22"/>
        <!-- Ojo mirando a la derecha -->
        <circle cx="48" cy="48" r="2" fill="#2D3748"/>
        
        <!-- Brazos relajados en el regazo -->
        <path d="M30,90 Q25,140 30,180" stroke="url(#grad-shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path d="M30,180 L70,190" stroke="url(#grad-skin)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <ellipse cx="75" cy="192" rx="10" ry="7" fill="url(#grad-skin)"/>

        <!-- Piernas -->
        <path d="M25,190 L100,190 Q110,190 110,200 L110,205 Q110,215 100,215 L25,215 Q15,215 15,205 L15,200 Q15,190 25,190 Z" fill="url(#grad-pants)"/>
        <path d="M100,205 L100,290 Q100,300 110,300 L115,300 Q125,300 125,290 L125,285 Q125,275 115,275 L110,275 L110,205 Z" fill="url(#grad-pants)"/>
        <path d="M105,290 L140,290 Q150,290 150,300 L150,305 Q150,315 140,315 L105,315 Q100,315 100,305 L100,300 Q100,290 105,290 Z" fill="#2D3748"/>
      </g>

      <!-- Anotaciones -->
      <!-- Línea de mirada -->
      <path d="M115,245 Q150,220 190,210" fill="none" stroke="#0b6b52" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="115" cy="245" r="3" fill="#0b6b52"/>
      <circle cx="190" cy="210" r="3" fill="#0b6b52"/>
      <text x="150" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#0b6b52">Mirada al horizonte</text>

      <!-- Icono de muñeca mejorado -->
      <g transform="translate(160, 420)">
        <circle cx="20" cy="20" r="18" fill="#F0F7FA" stroke="#0b6b52" stroke-width="1.5"/>
        <path d="M12,20 Q12,12 20,12 Q28,12 28,20" fill="none" stroke="#0b6b52" stroke-width="2" stroke-linecap="round"/>
        <path d="M28,20 Q28,28 20,28 Q12,28 12,20" fill="none" stroke="#0b6b52" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M26,14 L28,12 L30,14" fill="none" stroke="#0b6b52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14,26 L12,28 L10,26" fill="none" stroke="#0b6b52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Insignia de tiempo -->
      <g transform="translate(175, 620)">
        <rect x="-85" y="-25" width="170" height="50" rx="25" fill="#0b6b52" filter="url(#shadow-medium)"/>
        <circle cx="-55" cy="0" r="16" fill="#FFFFFF" opacity="0.2"/>
        <text x="-55" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">45</text>
        <text x="-32" y="5" font-size="12" fill="#FFFFFF" opacity="0.9">min</text>
        
        <line x1="-10" y1="-15" x2="-10" y2="15" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
        
        <circle cx="25" cy="0" r="16" fill="#FFFFFF" opacity="0.2"/>
        <text x="25" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">20</text>
        <text x="48" y="5" font-size="12" fill="#FFFFFF" opacity="0.9">seg</text>
      </g>
    </g>

    <!-- Encabezado Panel 3 -->
    <circle cx="30" cy="30" r="16" fill="#0b6b52"/>
    <text x="30" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="56" y="26" font-size="13" font-weight="700" fill="#2D3748">Descansa la vista</text>
    <text x="56" y="42" font-size="13" font-weight="700" fill="#2D3748">cada 45 minutos</text>
    <text x="175" y="710" text-anchor="middle" font-size="11" fill="#718096">Regla 20-20-20: Mira lejos 20 seg y mueve las muñecas</text>
  </g>
</svg>