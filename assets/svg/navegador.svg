<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="nav-t nav-d" font-family="Segoe UI, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="nav-t">La ventana del navegador: la barra de direcciones y el buscador</title>
  <desc id="nav-d">Captura estilizada de una ventana de navegador. La barra de direcciones muestra www.google.es y está señalada con el número 1. En la página, el buscador contiene la palabra gatos y está señalado con el número 2.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#e8efed"/>
    </linearGradient>
    <filter id="sombra-ventana" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173b34" flood-opacity=".16"/>
    </filter>
    <filter id="sombra-campo" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#202124" flood-opacity=".16"/>
    </filter>
    <clipPath id="recorte-ventana">
      <rect x="40" y="78" width="820" height="430" rx="14"/>
    </clipPath>
  </defs>

  <rect width="900" height="560" fill="url(#fondo)"/>
  <text x="40" y="50" font-size="30" font-weight="700" fill="#173b34">La ventana del navegador</text>

  <!-- Marco de la ventana -->
  <rect x="40" y="78" width="820" height="430" rx="14" fill="#fff" stroke="#b7c9c3" stroke-width="1.5" filter="url(#sombra-ventana)"/>
  <g clip-path="url(#recorte-ventana)">
    <!-- Pestañas -->
    <rect x="40" y="78" width="820" height="54" fill="#dee3e7"/>
    <path d="M56 132 V98 Q56 88 66 88 H226 Q236 88 236 98 V132 Z" fill="#fff"/>
    <circle cx="76" cy="110" r="7" fill="#fff" stroke="#4285f4" stroke-width="2"/>
    <path d="M76 103 A7 7 0 0 1 82 107" fill="none" stroke="#ea4335" stroke-width="2"/>
    <path d="M82 107 A7 7 0 0 1 80 115" fill="none" stroke="#fbbc05" stroke-width="2"/>
    <path d="M80 115 A7 7 0 0 1 70 114" fill="none" stroke="#34a853" stroke-width="2"/>
    <text x="91" y="115" font-size="13" font-weight="600" fill="#3c4043">Google</text>
    <path d="M216 106 l8 8 M224 106 l-8 8" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="248" y="93" width="38" height="34" rx="8" fill="#d5dade"/>
    <path d="M259 110 h16 M267 102 v16" stroke="#5f6368" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="786" y1="105" x2="798" y2="105" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="810" y="99" width="12" height="12" rx="2" fill="none" stroke="#5f6368" stroke-width="1.4"/>
    <path d="M834 99 l12 12 M846 99 l-12 12" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Barra de herramientas -->
    <rect x="40" y="132" width="820" height="54" fill="#f1f3f4"/>
    <path d="M68 151 l-8 8 8 8 M60 159 h18" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 151 l8 8-8 8 M104 159 H86" fill="none" stroke="#9aa0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M125 153 a8 8 0 1 1-1 10 M125 153 v6 h-6" fill="none" stroke="#5f6368" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Barra de direcciones resaltada -->
    <rect x="124" y="141" width="650" height="38" rx="19" fill="#e8f5f0" stroke="#0b6b52" stroke-width="2"/>
    <rect x="143" y="157" width="12" height="10" rx="2" fill="#0b6b52"/>
    <path d="M146 157 v-3.5 a3.5 3.5 0 0 1 7 0 v3.5" fill="none" stroke="#0b6b52" stroke-width="1.5"/>
    <text x="165" y="165" font-size="14" fill="#202124">www.google.es</text>
    <path d="M736 160 l5 5 11-11" fill="none" stroke="#0b6b52" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="816" cy="160" r="16" fill="#0b6b52" stroke="#fff" stroke-width="2.5"/>
    <text x="816" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>

    <line x1="40" y1="186" x2="860" y2="186" stroke="#dadce0" stroke-width="1"/>

    <!-- Página de búsqueda -->
    <rect x="40" y="187" width="820" height="321" fill="#fff"/>
    <text x="450" y="245" text-anchor="middle" font-size="43" font-weight="500" letter-spacing="-2">
      <tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan>
    </text>

    <!-- Campo del buscador -->
    <rect x="230" y="266" width="420" height="48" rx="24" fill="#fff" stroke="#0b6b52" stroke-width="2" filter="url(#sombra-campo)"/>
    <circle cx="257" cy="287" r="7" fill="none" stroke="#5f6368" stroke-width="1.8"/>
    <line x1="262" y1="292" x2="268" y2="298" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round"/>
    <text x="282" y="293" font-size="16" fill="#202124">gatos</text>
    <path d="M610 281 l12 12 M622 281 l-12 12" stroke="#70757a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="678" cy="290" r="16" fill="#0b6b52" stroke="#fff" stroke-width="2.5"/>
    <text x="678" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>

    <rect x="352" y="326" width="118" height="32" rx="4" fill="#f8f9fa"/>
    <text x="411" y="347" text-anchor="middle" font-size="13" fill="#3c4043">Buscar con Google</text>
    <rect x="478" y="326" width="114" height="32" rx="4" fill="#f8f9fa"/>
    <text x="535" y="347" text-anchor="middle" font-size="13" fill="#3c4043">Voy a tener suerte</text>

    <!-- Resultados insinuados -->
    <line x1="40" y1="371" x2="860" y2="371" stroke="#f1f3f4"/>
    <text x="250" y="391" font-size="11" fill="#70757a">Aproximadamente 12.300.000 resultados</text>
    <text x="250" y="414" font-size="13" fill="#202124">https://www.ejemplo.es › animales › gatos</text>
    <text x="250" y="435" font-size="17" fill="#1a0dab">Gatos: cuidados, características y curiosidades</text>
    <text x="250" y="453" font-size="12" fill="#4d5156">Descubre todo sobre los gatos: sus hábitos, alimentación y los mejores consejos</text>
    <text x="250" y="469" font-size="12" fill="#4d5156">para cuidar de tu compañero felino.</text>
    <text x="250" y="491" font-size="13" fill="#202124">https://www.mascotas.es › guia › gatos</text>
  </g>

  <!-- Leyenda -->
  <circle cx="58" cy="543" r="10" fill="#0b6b52"/>
  <text x="58" y="547" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="76" y="548" font-size="14" fill="#47595a">Barra de direcciones</text>
  <circle cx="232" cy="543" r="10" fill="#0b6b52"/>
  <text x="232" y="547" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="250" y="548" font-size="14" fill="#47595a">Buscador</text>
</svg>
