<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 420"
     role="img"
     aria-labelledby="ab-t ab-d">
  <title id="ab-t">Barra de direcciones del navegador frente a un buscador web</title>
  <desc id="ab-d">
    Comparación realista: arriba, la barra de direcciones del navegador con la URL exacta.
    Abajo, una página de resultados de búsqueda mostrando un anuncio en la primera posición.
  </desc>

  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="520" height="420" rx="12" fill="#f8f9fa"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="20" y="20" width="480" height="130" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

    <path d="M20 52 L20 32 Q20 24 28 24 L180 24 Q188 24 188 32 L188 52 Z" fill="#ffffff"/>
    <line x1="20" y1="52" x2="188" y2="52" stroke="#ffffff" stroke-width="2"/>
    <text x="40" y="39" font-size="12" fill="#3c4043" font-weight="500">XAMPP - Apache Friends</text>
    <circle cx="30" cy="34" r="6" fill="#0b6b52"/>

    <rect x="0" y="20" width="520" height="32" fill="#ffffff"/>
    <rect x="20" y="20" width="480" height="32" fill="#ffffff"/>

    <circle cx="40" cy="36" r="8" fill="none" stroke="#5f6368" stroke-width="1.5"/>
    <path d="M43 36 L38 36 M38 36 L40 34 M38 36 L40 38" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="70" y="26" width="360" height="28" rx="14" fill="#f1f3f4" stroke="#f1f3f4" stroke-width="1"/>
    <path d="M82 36 v-3 a3 3 0 0 1 6 0 v3 h-6 z M81 36 h8 v5 h-8 z" fill="none" stroke="#0b6b52" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="98" y="45" font-size="13" fill="#202124" font-weight="400">apachefriends.org/es/xampp</text>

    <path d="M415 36 l1.5 3 3.5 0.5 -2.5 2.5 0.5 3.5 -3 -1.5 -3 1.5 0.5 -3.5 -2.5 -2.5 3.5 -0.5 z" fill="none" stroke="#5f6368" stroke-width="1.2"/>

    <text x="40" y="85" font-size="13" fill="#202124" font-weight="600">Escribir la URL exacta en la barra de direcciones</text>
    <text x="40" y="105" font-size="13" fill="#0b6b52" font-weight="500">✓ Te lleva directamente a la web oficial, sin intermediarios.</text>

    <rect x="20" y="160" width="480" height="245" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

    <rect x="40" y="180" width="440" height="44" rx="22" fill="#ffffff" stroke="#dfe1e5" stroke-width="1" filter="url(#shadow-sm)"/>
    <circle cx="64" cy="200" r="5" fill="none" stroke="#4285f4" stroke-width="1.8"/>
    <path d="M67.5 203.5 L71 207" stroke="#4285f4" stroke-width="1.8" stroke-linecap="round"/>
    <text x="84" y="205" font-size="14" fill="#202124">descargar xampp</text>
    <circle cx="455" cy="202" r="8" fill="none" stroke="#4285f4" stroke-width="1.5"/>

    <rect x="40" y="245" width="48" height="16" rx="3" fill="#fef7e0"/>
    <text x="64" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#b06000">Anuncio</text>

    <text x="98" y="257" font-size="12" fill="#4d5156">www.descargas-rapidas-gratis.net/xampp</text>

    <text x="40" y="278" font-size="16" fill="#1a0dab" font-weight="500" style="text-decoration: underline; text-decoration-color: #1a0dab; text-underline-offset: 3px;">Descargar XAMPP Gratis - Sitio Oficial (Falso)</text>

    <text x="40" y="298" font-size="13" fill="#4d5156">Descarga XAMPP aquí de forma rápida y segura. Incluye Apache, MySQL, PHP...</text>

    <text x="40" y="325" font-size="12" fill="#4d5156">www.apachefriends.org › es › xampp</text>

    <text x="40" y="346" font-size="16" fill="#0b6b52" font-weight="500">XAMPP - Apache Friends</text>

    <text x="40" y="375" font-size="12" fill="#d93025" font-weight="600">⚠ Los buscadores muestran anuncios en los primeros resultados.</text>
    <text x="40" y="392" font-size="12" fill="#5f6368">Estos enlaces pueden llevar a sitios no oficiales o con software modificado.</text>
  </g>
</svg>
