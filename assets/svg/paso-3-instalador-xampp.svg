<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 340"
     role="img"
     aria-labelledby="inst-t inst-d">
  <title id="inst-t">Instalador de XAMPP con botón Next destacado</title>
  <desc id="inst-d">
    Pantalla del instalador de XAMPP mostrando la selección de
    componentes y el botón Next en la parte inferior derecha.
  </desc>
  <rect width="560" height="340" fill="#eef2f1"/>
  <rect x="20" y="20" width="520" height="300" rx="10" fill="#ffffff" stroke="#c7cdd2"/>
  <rect x="30" y="32" width="500" height="30" fill="#1d2327" rx="6"/>
  <text x="50" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">XAMPP Setup</text>
  <rect x="30" y="80" width="160" height="40" fill="#f8f9fa" stroke="#d7dce0" rx="6"/>
  <text x="44" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d2327">Seleccionar componentes</text>
  <rect x="44" y="132" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="54" y="154" font-size="12" fill="#1d2327">Apache</text>
  <rect x="44" y="172" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="54" y="194" font-size="12" fill="#1d2327">MySQL</text>
  <rect x="44" y="212" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="54" y="234" font-size="12" fill="#1d2327">phpMyAdmin</text>
  <rect x="94" y="132" width="30" height="30" fill="#eef7f5" stroke="#0b6b52" rx="4"/>
  <rect x="94" y="172" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="104" y="154" font-size="12" fill="#5c6b68">FileZilla</text>
  <rect x="94" y="172" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="104" y="194" font-size="12" fill="#5c6b68">Mercury</text>
  <rect x="94" y="212" width="30" height="30" fill="#ffffff" stroke="#8c8f94" rx="4"/>
  <text x="104" y="234" font-size="12" fill="#5c6b68">Tomcat</text>
  <rect x="400" y="260" width="110" height="36" rx="6" fill="#0b6b52"/>
  <text x="455" y="281" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Next ></text>
  <rect x="280" y="260" width="100" height="36" rx="6" fill="#f0f0f0" stroke="#8c8f94"/>
  <text x="330" y="281" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b68">Cancelar</text>
</svg>
