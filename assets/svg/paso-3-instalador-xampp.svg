<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 340"
     width="560"
     height="340"
     role="img"
     aria-labelledby="inst-t inst-d">
  <title id="inst-t">XAMPP Setup — Select Components</title>
  <desc id="inst-d">A realistic Windows installer screen showing the XAMPP component selection list, required components checked, optional components unchecked, and the Next button ready to continue.</desc>

  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f6f7"/>
    </linearGradient>
    <linearGradient id="nextButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2fc"/>
    </linearGradient>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#25313b" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#e9edf1"/>
  <rect x="14" y="12" width="532" height="316" rx="7" fill="#ffffff" stroke="#aeb7c0" filter="url(#windowShadow)"/>

  <path d="M21 12h518a7 7 0 0 1 7 7v25H14V19a7 7 0 0 1 7-7z" fill="url(#titlebar)"/>
  <path d="M14 44h532" stroke="#d4d9de"/>
  <rect x="28" y="20" width="16" height="16" rx="3" fill="#e87924"/>
  <path d="M32 23l8 10M40 23l-8 10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#252a30">XAMPP Setup</text>
  <path d="M512 24l10 10m0-10l-10 10" stroke="#5d656d" stroke-width="1.2"/>

  <rect x="14" y="44" width="532" height="234" fill="#ffffff"/>
  <rect x="31" y="58" width="38" height="38" rx="5" fill="#f07b24"/>
  <path d="M40 65l20 24M60 65L40 89" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="82" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#22272c">Select Components</text>
  <text x="82" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#58616a">Choose the components you want to install.</text>

  <text x="38" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#39424a">Components</text>
  <text x="442" y="116" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#66717b">Size</text>
  <rect x="31" y="122" width="498" height="142" rx="3" fill="#fff" stroke="#c8cdd2"/>

  <rect x="32" y="123" width="496" height="16" fill="#f5f7f8"/>
  <rect x="32" y="155" width="496" height="16" fill="#f5f7f8"/>
  <rect x="32" y="187" width="496" height="16" fill="#f5f7f8"/>
  <rect x="32" y="219" width="496" height="16" fill="#f5f7f8"/>
  <rect x="32" y="251" width="496" height="12" fill="#f5f7f8"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#252a30">
    <g transform="translate(0,0)">
      <rect x="43" y="125" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <path d="M45.5 131l2.5 2.5 5-6" fill="none" stroke="#1874c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="135">Apache</text><text x="465" y="135" text-anchor="end" fill="#68737d">44 MB</text>
    </g>
    <g>
      <rect x="43" y="141" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <path d="M45.5 147l2.5 2.5 5-6" fill="none" stroke="#1874c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="151">MySQL</text><text x="465" y="151" text-anchor="end" fill="#68737d">72 MB</text>
    </g>
    <g>
      <rect x="43" y="157" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <text x="64" y="167">FileZilla FTP Server</text><text x="465" y="167" text-anchor="end" fill="#68737d">15 MB</text>
    </g>
    <g>
      <rect x="43" y="173" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <text x="64" y="183">Mercury Mail Server</text><text x="465" y="183" text-anchor="end" fill="#68737d">6 MB</text>
    </g>
    <g>
      <rect x="43" y="189" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <text x="64" y="199">Tomcat</text><text x="465" y="199" text-anchor="end" fill="#68737d">28 MB</text>
    </g>
    <g>
      <rect x="43" y="205" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <path d="M45.5 211l2.5 2.5 5-6" fill="none" stroke="#1874c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="215">PHP</text><text x="465" y="215" text-anchor="end" fill="#68737d">18 MB</text>
    </g>
    <g>
      <rect x="43" y="221" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <path d="M45.5 227l2.5 2.5 5-6" fill="none" stroke="#1874c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="231">phpMyAdmin</text><text x="465" y="231" text-anchor="end" fill="#68737d">15 MB</text>
    </g>
    <g>
      <rect x="43" y="237" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <text x="64" y="247">Webalizer</text><text x="465" y="247" text-anchor="end" fill="#68737d">1 MB</text>
    </g>
    <g>
      <rect x="43" y="251" width="12" height="12" rx="1.5" fill="#fff" stroke="#7d8993"/>
      <text x="64" y="261">Fake Sendmail</text><text x="465" y="261" text-anchor="end" fill="#68737d">1 MB</text>
    </g>
  </g>

  <path d="M14 278h532" stroke="#d4d9de"/>
  <text x="31" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#68717a">Required components are selected by default.</text>

  <rect x="306" y="286" width="70" height="27" rx="3" fill="#f7f7f7" stroke="#aeb6be"/>
  <text x="341" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#30363c">&lt; Back</text>

  <rect x="384" y="286" width="70" height="27" rx="3" fill="url(#nextButton)" stroke="#2674c8" stroke-width="1.4"/>
  <rect x="387" y="289" width="64" height="21" rx="2" fill="none" stroke="#b7d2ef"/>
  <text x="419" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f4e79">Next &gt;</text>

  <rect x="462" y="286" width="70" height="27" rx="3" fill="#f7f7f7" stroke="#aeb6be"/>
  <text x="497" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#30363c">Cancel</text>
</svg>