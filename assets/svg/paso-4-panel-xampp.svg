<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 320"
     role="img"
     aria-labelledby="xm-t xm-d">
  <title id="xm-t">Panel de control real de XAMPP con servicios en ejecución</title>
  <desc id="xm-d">
    Interfaz auténtica del XAMPP Control Panel v3.3.0. Muestra las columnas de Módulo,
    PID, Puertos y Servicio, con los indicadores cuadrados verdes de 'Running' para
    Apache y MySQL, y la ventana de logs inferior.
  </desc>

  <rect width="560" height="320" rx="8" fill="#f4f6f8"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="20" y="20" width="520" height="32" fill="#2d2d2d" rx="4"/>
    <rect x="20" y="48" width="520" height="4" fill="#2d2d2d"/>

    <path d="M36 36 Q 32 28, 40 26 Q 46 28, 44 34 Q 48 30, 50 36 Q 52 42, 44 44 Q 38 46, 36 36 Z" fill="#ffffff" opacity="0.9"/>
    <text x="60" y="41" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="0.3">XAMPP Control Panel v3.3.0</text>

    <rect x="500" y="26" width="12" height="12" fill="#2d2d2d" stroke="#666666" stroke-width="1"/>
    <line x1="503" y1="32" x2="509" y2="32" stroke="#666666" stroke-width="1.5"/>
    <rect x="516" y="26" width="12" height="12" fill="#2d2d2d" stroke="#666666" stroke-width="1"/>
    <rect x="532" y="26" width="12" height="12" fill="#2d2d2d" stroke="#666666" stroke-width="1"/>
    <path d="M535 29 L541 35 M541 29 L535 35" stroke="#666666" stroke-width="1.5"/>

    <rect x="20" y="52" width="520" height="28" fill="#e8e8e8" stroke="#cccccc" stroke-width="1"/>
    <text x="32" y="70" font-size="11" fill="#333333">Config</text>
    <text x="80" y="70" font-size="11" fill="#333333">Netstat</text>
    <text x="135" y="70" font-size="11" fill="#333333">Logs</text>
    <text x="175" y="70" font-size="11" fill="#333333">Services</text>

    <rect x="20" y="80" width="520" height="26" fill="#dcdcdc" stroke="#b0b0b0" stroke-width="1"/>
    <text x="32" y="97" font-size="11" font-weight="700" fill="#333333">Module</text>
    <text x="110" y="97" font-size="11" font-weight="700" fill="#333333">PID(s)</text>
    <text x="170" y="97" font-size="11" font-weight="700" fill="#333333">Port(s)</text>
    <text x="250" y="97" font-size="11" font-weight="700" fill="#333333">Service</text>
    <text x="340" y="97" font-size="11" font-weight="700" fill="#333333">Actions</text>

    <rect x="20" y="106" width="520" height="34" fill="#ffffff"/>
    <rect x="32" y="116" width="10" height="10" fill="#4caf50"/>
    <text x="50" y="126" font-size="12" font-weight="600" fill="#111111">Apache</text>
    <text x="110" y="126" font-size="12" fill="#333333" font-family="Consolas, monospace">8432</text>
    <text x="170" y="126" font-size="12" fill="#333333" font-family="Consolas, monospace">80, 443</text>
    <text x="250" y="126" font-size="12" fill="#333333">Running</text>

    <rect x="330" y="112" width="52" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="356" y="127" font-size="11" fill="#888888" text-anchor="middle">Start</text>

    <rect x="388" y="112" width="52" height="22" rx="2" fill="#f8d7da" stroke="#d32f2f" stroke-width="1.2"/>
    <text x="414" y="127" font-size="11" font-weight="700" fill="#d32f2f" text-anchor="middle">Stop</text>

    <rect x="446" y="112" width="52" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="472" y="127" font-size="11" fill="#333333" text-anchor="middle">Admin</text>

    <rect x="504" y="112" width="30" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="519" y="127" font-size="11" fill="#333333" text-anchor="middle">Cfg</text>

    <rect x="20" y="140" width="520" height="34" fill="#f9f9f9"/>
    <rect x="32" y="150" width="10" height="10" fill="#4caf50"/>
    <text x="50" y="160" font-size="12" font-weight="600" fill="#111111">MySQL</text>
    <text x="110" y="160" font-size="12" fill="#333333" font-family="Consolas, monospace">5678</text>
    <text x="170" y="160" font-size="12" fill="#333333" font-family="Consolas, monospace">3306</text>
    <text x="250" y="160" font-size="12" fill="#333333">Running</text>

    <rect x="330" y="146" width="52" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="356" y="161" font-size="11" fill="#888888" text-anchor="middle">Start</text>

    <rect x="388" y="146" width="52" height="22" rx="2" fill="#f8d7da" stroke="#d32f2f" stroke-width="1.2"/>
    <text x="414" y="161" font-size="11" font-weight="700" fill="#d32f2f" text-anchor="middle">Stop</text>

    <rect x="446" y="146" width="52" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="472" y="161" font-size="11" fill="#333333" text-anchor="middle">Admin</text>

    <rect x="504" y="146" width="30" height="22" rx="2" fill="#e0e0e0" stroke="#a0a0a0"/>
    <text x="519" y="161" font-size="11" fill="#333333" text-anchor="middle">Cfg</text>

    <rect x="20" y="180" width="520" height="90" fill="#ffffff" stroke="#a0a0a0" stroke-width="1"/>
    <rect x="20" y="180" width="520" height="22" fill="#e8e8e8" stroke-bottom="#a0a0a0" stroke-width="1"/>
    <text x="28" y="195" font-size="11" font-weight="600" fill="#333333">Logs</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="11">
      <text x="28" y="215" fill="#666666">10:15:30 [main] Initializing Control Panel</text>
      <text x="28" y="232" fill="#666666">10:15:31 [Apache] Status change detected: <tspan fill="#2e7d32" font-weight="700">running</tspan></text>
      <text x="28" y="249" fill="#666666">10:15:31 [mysql] Status change detected: <tspan fill="#2e7d32" font-weight="700">running</tspan></text>
      <text x="28" y="266" fill="#666666">10:15:31 [main] The Apache module is running on port(s): 80, 443</text>
    </g>

    <rect x="40" y="285" width="480" height="24" rx="12" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="280" y="301" font-size="11.5" font-weight="600" fill="#2e7d32" text-anchor="middle">
      El cuadrado verde y el texto "Running" en los logs confirman que el servicio está activo y escuchando en sus puertos.
    </text>
  </g>
</svg>
