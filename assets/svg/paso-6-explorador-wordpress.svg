<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 340"
     role="img"
     aria-labelledby="dl-t dl-d">
  <title id="dl-t">Explorador de archivos mostrando la extracción de wordpress.zip</title>
  <desc id="dl-d">
    Ventana realista del explorador de archivos. La carpeta Descargas está
    seleccionada. Se muestra el menú contextual abierto sobre el archivo
    wordpress.zip, con la opción 'Extraer todo' destacada.
  </desc>

  <defs>
    <linearGradient id="desktopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#dde4ea"/>
    </linearGradient>
    <filter id="win-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="menu-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="window-inner" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="-1" k3="1" result="diff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.9"/>
      <feComposite in2="diff" operator="in" result="hi"/>
      <feComposite in="hi" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="selGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4ef"/>
      <stop offset="1" stop-color="#d6ebe1"/>
    </linearGradient>
    <linearGradient id="menuHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4ef"/>
      <stop offset="1" stop-color="#d4e9df"/>
    </linearGradient>
    <linearGradient id="zipBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="zipStripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sidebarBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f9fa"/>
      <stop offset="1" stop-color="#f1f4f6"/>
    </linearGradient>
  </defs>

  <rect width="560" height="340" fill="url(#desktopBg)" rx="12"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g filter="url(#win-shadow)">
      <rect x="20" y="20" width="520" height="300" rx="10" fill="#ffffff"/>
      <rect x="20.5" y="20.5" width="519" height="299" rx="9.5" fill="none" stroke="#d1d5db" stroke-width="1"/>
      <rect x="21" y="21" width="518" height="298" rx="9" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.8"/>
    </g>

    <path d="M20 30 a10 10 0 0 1 10-10 h500 a10 10 0 0 1 10 10 v26 H20 Z" fill="url(#titleBar)"/>
    <line x1="20" y1="56" x2="540" y2="56" stroke="#e5e7eb" stroke-width="1"/>

    <g transform="translate(36, 32)">
      <path d="M0 4 L0 14 L14 14 L14 4 Z" fill="#f59e0b"/>
      <path d="M0 4 L5 4 L6 6 L14 6 L14 14 L0 14 Z" fill="#fbbf24"/>
    </g>
    <text x="60" y="44" font-size="12" font-weight="600" fill="#1f2937">Descargas</text>

    <g>
      <rect x="482" y="28" width="16" height="16" rx="3" fill="none"/>
      <line x1="486" y1="36" x2="494" y2="36" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="502" y="28" width="16" height="16" rx="3" fill="none"/>
      <rect x="506" y="32" width="8" height="8" rx="1" fill="none" stroke="#6b7280" stroke-width="1.2"/>
      <rect x="522" y="28" width="16" height="16" rx="3" fill="none"/>
      <path d="M526 32 L534 40 M534 32 L526 40" stroke="#ef4444" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <rect x="20" y="56" width="520" height="42" fill="#ffffff"/>
    <line x1="20" y1="97" x2="540" y2="97" stroke="#e5e7eb" stroke-width="1"/>

    <g transform="translate(34, 64)">
      <circle cx="10" cy="12" r="10" fill="#f3f4f6"/>
      <path d="M12 7 L7 12 L12 17" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="12" r="10" fill="#f3f4f6"/>
      <path d="M28 7 L33 12 L28 17" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="12" r="10" fill="#f3f4f6"/>
      <path d="M45 12 A5 5 0 1 1 55 12 A5 5 0 1 1 45 12 M52 8 L55 12 L52 16" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="110" y="66" width="260" height="22" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="110" y="66" width="260" height="11" rx="6" fill="#ffffff" opacity="0.5"/>
    <g transform="translate(122, 74)">
      <path d="M0 -4 L4 0 L0 4 Z" fill="#6b7280"/>
    </g>
    <text x="132" y="80" font-size="12" fill="#374151">Este equipo <tspan fill="#9ca3af">›</tspan> Descargas</text>

    <rect x="380" y="66" width="140" height="22" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="380" y="66" width="140" height="11" rx="6" fill="#ffffff" opacity="0.5"/>
    <circle cx="394" cy="77" r="4" fill="none" stroke="#6b7280" stroke-width="1.4"/>
    <path d="M397 80 L400 83" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
    <text x="406" y="81" font-size="11" fill="#9ca3af">Buscar en Descargas</text>

    <rect x="20" y="97" width="140" height="223" fill="url(#sidebarBg)"/>
    <line x1="159" y1="97" x2="159" y2="320" stroke="#e5e7eb" stroke-width="1"/>

    <g font-size="12" fill="#4b5563">
      <g transform="translate(32, 112)">
        <path d="M0 6 L6 0 L12 6 L12 14 L0 14 Z" fill="#dfb84f"/>
        <text x="52" y="124">Acceso rápido</text>
      </g>
      <rect x="24" y="138" width="128" height="30" rx="6" fill="url(#selGreen)" stroke="#b8dccb" stroke-width="1"/>
      <rect x="24" y="138" width="128" height="15" rx="6" fill="#ffffff" opacity="0.4"/>
      <g transform="translate(34, 146)">
        <path d="M0 0 L10 0 L10 12 L0 12 Z" fill="#0b6b52" opacity="0.15"/>
        <path d="M0 0 L10 0 L10 12 L0 12 Z" fill="none" stroke="#0b6b52" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M2 0 L8 0 L8 3 L2 3 Z" fill="#0b6b52"/>
      </g>
      <text x="52" y="157" font-weight="600" fill="#0b6b52">Descargas</text>
      <g transform="translate(32, 182)">
        <path d="M0 0 L8 0 L10 3 L10 12 L0 12 Z" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M8 0 L8 3 L10 3" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
      </g>
      <text x="52" y="192">Documentos</text>
      <g transform="translate(32, 216)">
        <rect x="0" y="0" width="12" height="12" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
        <circle cx="4" cy="4" r="1.5" fill="#9ca3af"/>
        <path d="M0 10 L4 6 L7 9 L10 6 L12 8 L12 12 L0 12 Z" fill="#9ca3af" opacity="0.6"/>
      </g>
      <text x="52" y="227">Imágenes</text>
    </g>

    <rect x="160" y="97" width="380" height="223" fill="#ffffff"/>

    <g font-size="11" font-weight="600" fill="#6b7280">
      <text x="180" y="116">Nombre</text>
      <text x="340" y="116">Fecha de modificación</text>
      <text x="440" y="116">Tipo</text>
      <text x="500" y="116">Tamaño</text>
    </g>
    <line x1="176" y1="124" x2="536" y2="124" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="176" y="130" width="360" height="38" fill="url(#selGreen)" stroke="#b8dccb" stroke-width="1"/>
    <rect x="176" y="130" width="360" height="19" fill="#ffffff" opacity="0.35"/>

    <g transform="translate(176, 137)">
      <rect x="0" y="0" width="24" height="24" rx="3" fill="url(#zipBody)" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="0" width="24" height="12" rx="3" fill="#ffffff" opacity="0.6"/>
      <path d="M18 0 L18 5 L24 5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
      <line x1="12" y1="6" x2="12" y2="22" stroke="url(#zipStripe)" stroke-width="2.5" stroke-dasharray="2.5,2"/>
      <circle cx="12" cy="8" r="2.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.8"/>
      <circle cx="12" cy="8" r="1" fill="#fff7ed"/>
    </g>

    <g font-size="12">
      <text x="212" y="153" font-weight="600" fill="#111827">wordpress.zip</text>
      <text x="340" y="153" fill="#6b7280">Hoy 10:30</text>
      <text x="440" y="153" fill="#6b7280">Archivo comprimido</text>
      <text x="500" y="153" fill="#6b7280">24,8 MB</text>
    </g>

    <g font-size="12" fill="#6b7280">
      <rect x="176" y="172" width="16" height="16" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <path d="M180 180 L184 176 L188 180 L184 184 Z" fill="#0284c7" opacity="0.7"/>
      <text x="212" y="184" fill="#111827">proyecto-web.zip</text>
      <text x="340" y="184">Ayer 18:45</text>
      <text x="440" y="184">Archivo comprimido</text>
      <text x="500" y="184">12,1 MB</text>

      <rect x="176" y="208" width="16" height="16" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <path d="M180 212 L188 212 L188 220 L180 220 Z" fill="#f59e0b" opacity="0.6"/>
      <text x="212" y="220" fill="#111827">imagenes.rar</text>
      <text x="340" y="220">Lun 09:12</text>
      <text x="440" y="220">Archivo comprimido</text>
      <text x="500" y="220">8,4 MB</text>

      <rect x="176" y="244" width="16" height="16" rx="2" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1"/>
      <path d="M180 248 L188 248 L188 256 L180 256 Z" fill="#8b5cf6" opacity="0.6"/>
      <text x="212" y="256" fill="#111827">backup-2024.zip</text>
      <text x="340" y="256">Vie 14:20</text>
      <text x="440" y="256">Archivo comprimido</text>
      <text x="500" y="256">45,2 MB</text>
    </g>

    <g transform="translate(298, 128)" filter="url(#menu-shadow)">
      <rect x="0" y="0" width="190" height="132" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <rect x="0.5" y="0.5" width="189" height="131" rx="7.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.9"/>

      <g font-size="12.5" fill="#374151">
        <rect x="6" y="6" width="178" height="28" rx="5" fill="transparent"/>
        <g transform="translate(16, 15)">
          <path d="M0 4 L0 12 L10 12 L10 4 Z" fill="none" stroke="#6b7280" stroke-width="1.3"/>
          <path d="M0 4 L4 4 L5 6 L10 6" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        </g>
        <text x="34" y="25">Abrir</text>

        <rect x="6" y="40" width="178" height="28" rx="5" fill="url(#menuHighlight)" stroke="#b8dccb" stroke-width="1"/>
        <rect x="6" y="40" width="178" height="14" rx="5" fill="#ffffff" opacity="0.35"/>
        <g transform="translate(14, 47)">
          <path d="M2 0 L2 8 M0 6 L4 10 L8 6" fill="none" stroke="#0b6b52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M0 12 L10 12" stroke="#0b6b52" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <text x="34" y="59" font-weight="700" fill="#0b6b52">Extraer todo...</text>

        <line x1="10" y1="76" x2="180" y2="76" stroke="#e5e7eb" stroke-width="1"/>

        <rect x="6" y="80" width="178" height="24" rx="5" fill="transparent"/>
        <g transform="translate(16, 86)">
          <path d="M0 0 L8 10 M8 0 L0 10" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="2" cy="8" r="2" fill="none" stroke="#6b7280" stroke-width="1.2"/>
          <circle cx="6" cy="8" r="2" fill="none" stroke="#6b7280" stroke-width="1.2"/>
        </g>
        <text x="34" y="96">Cortar</text>

        <rect x="6" y="106" width="178" height="24" rx="5" fill="transparent"/>
        <g transform="translate(16, 111)">
          <rect x="0" y="0" width="8" height="10" rx="1" fill="none" stroke="#6b7280" stroke-width="1.2"/>
          <rect x="2" y="2" width="8" height="10" rx="1" fill="none" stroke="#6b7280" stroke-width="1.2"/>
        </g>
        <text x="34" y="122">Copiar</text>
      </g>
    </g>

    <g transform="translate(286, 144)">
      <path d="M0 0 L0 14 L4 10 L7 15 L9 14 L6 9 L11 9 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
