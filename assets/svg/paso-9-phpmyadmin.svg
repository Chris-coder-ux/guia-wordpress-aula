<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="db-t db-d">
  <title id="db-t">phpMyAdmin: pestaña Bases de datos</title>
  <desc id="db-d">Captura de phpMyAdmin en localhost. La pestaña Bases de datos está seleccionada y el formulario para crear una base de datos contiene wordpress_db junto al botón Crear.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#25313b" flood-opacity=".16"/>
    </filter>
    <linearGradient id="browser" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="brand" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#edf0f2"/>
    </linearGradient>
  </defs>

  <rect width="560" height="340" fill="#e9eef2"/>
  <rect x="12" y="8" width="536" height="324" rx="8" fill="#fff" stroke="#c5cbd1" filter="url(#shadow)"/>

  <!-- Browser chrome -->
  <path d="M20 8h520a8 8 0 0 1 8 8v27H12V16a8 8 0 0 1 8-8z" fill="url(#browser)"/>
  <circle cx="29" cy="25" r="4" fill="#ed6a5e"/>
  <circle cx="43" cy="25" r="4" fill="#f4bf4f"/>
  <circle cx="57" cy="25" r="4" fill="#61c554"/>
  <rect x="91" y="15" width="376" height="21" rx="10.5" fill="#fff" stroke="#d1d6db"/>
  <path d="M105 22v-2.5a3 3 0 0 1 6 0V22m-7 0h8v7h-8z" fill="none" stroke="#7b858d" stroke-width="1"/>
  <text x="120" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#59636b">http://localhost/phpmyadmin/</text>
  <path d="M485 21h10m-5-5v10" stroke="#84909a" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M513 18a6 6 0 1 0 2 8" fill="none" stroke="#7d8992" stroke-width="1.2"/>
  <path d="m513 17 2 1-1 2" fill="none" stroke="#7d8992" stroke-width="1.2"/>

  <!-- phpMyAdmin header -->
  <rect x="12" y="43" width="536" height="46" fill="url(#brand)"/>
  <path d="M12 88.5h536" stroke="#c9d0d5"/>
  <g transform="translate(29 54)">
    <path d="M0 0h18c7 0 10 3.2 10 8.5S24 17 17 17H8v8H0z" fill="#687782"/>
    <path d="M8 6v6h8c2.5 0 3.5-1 3.5-3S18.5 6 16 6z" fill="#f3f5f6"/>
    <path d="M32 7h9v5h-9v7h-7V0h19v5H32z" fill="#f39c36"/>
    <text x="46" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#52616b">phpMyAdmin</text>
  </g>
  <text x="520" y="70" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#66737c">Servidor: localhost</text>

  <!-- Navigation tabs -->
  <rect x="12" y="89" width="536" height="35" fill="#f7f8f9"/>
  <path d="M12 123.5h536" stroke="#cbd1d6"/>
  <rect x="23" y="94" width="119" height="29" rx="4" fill="#fff" stroke="#cbd1d6"/>
  <path d="M34 104h11v10H34zM36 102h7v2h-7zm-2 5h11" fill="none" stroke="#52616b" stroke-width="1"/>
  <text x="51" y="112.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#34434d">Bases de datos</text>
  <text x="160" y="112.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52616b">SQL</text>
  <text x="205" y="112.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52616b">Estado</text>
  <text x="258" y="112.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#52616b">Cuentas de usuario</text>

  <!-- Page content -->
  <rect x="12" y="124" width="536" height="206" fill="#fff"/>
  <path d="M31 143h14v11H31zM33 140h10v3H33zm-2 7h14" fill="none" stroke="#52616b" stroke-width="1.2"/>
  <text x="53" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#303b42">Bases de datos</text>
  <text x="31" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#69757d">Crear una base de datos</text>

  <rect x="30" y="181" width="500" height="126" rx="4" fill="#fff" stroke="#d5dade"/>
  <rect x="30" y="181" width="500" height="29" rx="4" fill="#f6f7f8"/>
  <path d="M30 210h500" stroke="#d5dade"/>
  <text x="43" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#3d484f">Crear base de datos</text>

  <text x="44" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#3d484f">Nombre de la base de datos</text>
  <rect x="44" y="237" width="333" height="34" rx="3" fill="#fff" stroke="#9da8af"/>
  <text x="55" y="258.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#303b42">wordpress_db</text>
  <rect x="389" y="237" width="91" height="34" rx="3" fill="#337ab7" stroke="#2e6da4"/>
  <text x="434.5" y="258.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Crear</text>
  <text x="44" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#707b82">El cotejamiento se puede configurar después de crear la base de datos.</text>
</svg>