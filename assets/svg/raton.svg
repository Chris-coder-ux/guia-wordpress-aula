<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="rat-t rat-d" font-family="Segoe UI, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="rat-t">Cómo apoyar la mano en el ratón y dónde está el puntero</title>
  <desc id="rat-d">A la izquierda, un ratón visto desde arriba con una mano apoyada encima: el dedo índice queda sobre el botón izquierdo y el corazón sobre el botón derecho. A la derecha, el puntero o flechita que se mueve por la pantalla, primero en grande y luego pequeño sobre una ventana con un icono.</desc>

  <defs>
    <linearGradient id="rat-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#e8efed"/>
    </linearGradient>
    <linearGradient id="rat-cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f0"/>
      <stop offset="1" stop-color="#c6d0ce"/>
    </linearGradient>
    <filter id="rat-sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#173b34" flood-opacity="0.12"/>
    </filter>
    <filter id="rat-sombra-fina" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#173b34" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#rat-fondo)"/>

  <!-- Tarjeta 1: postura de la mano -->
  <rect x="32" y="32" width="524" height="496" rx="18" fill="#ffffff" stroke="#b7c9c3" stroke-width="1.5" filter="url(#rat-sombra)"/>
  <circle cx="68" cy="76" r="16" fill="#e8f5f0" stroke="#c9e7dc" stroke-width="1.5"/>
  <text x="68" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b52">1</text>
  <text x="96" y="83" font-size="22" font-weight="700" fill="#173b34">Cómo apoyar la mano</text>

  <!-- Ratón visto desde arriba, con la mano apoyada -->
  <g transform="translate(-42 -180) scale(1.5)">
    <g filter="url(#rat-sombra-fina)">
      <rect x="155" y="220" width="170" height="198" rx="82" fill="url(#rat-cuerpo)" stroke="#47595a" stroke-width="2"/>
      <path d="M156 300 A84 80 0 0 1 240 220 L240 300 Z" fill="#e2f0ea" stroke="#47595a" stroke-width="2"/>
      <path d="M240 220 A84 80 0 0 1 324 300 L240 300 Z" fill="#f8edda" stroke="#47595a" stroke-width="2"/>
      <line x1="240" y1="221" x2="240" y2="300" stroke="#47595a" stroke-width="2"/>
      <rect x="232" y="263" width="16" height="39" rx="8" fill="#47595a"/>
      <line x1="240" y1="269" x2="240" y2="295" stroke="#cdd9d5" stroke-width="1.5" stroke-dasharray="2 3"/>
    </g>

    <!-- Mano -->
    <g filter="url(#rat-sombra-fina)">
      <path d="M211 380 C207 400 204 412 204 423 Q204 429 210 429 L270 429 Q276 429 276 423 C276 412 272 397 269 380 Z" fill="#f4c89e" stroke="#d79f72" stroke-width="2"/>
      <g stroke="#d79f72" stroke-width="27" stroke-linecap="round">
        <line x1="216" y1="342" x2="205" y2="274"/>
        <line x1="258" y1="342" x2="272" y2="274"/>
        <line x1="194" y1="356" x2="166" y2="330"/>
        <line x1="282" y1="349" x2="308" y2="326"/>
        <line x1="289" y1="365" x2="316" y2="350"/>
      </g>
      <g stroke="#f4c89e" stroke-width="22" stroke-linecap="round">
        <line x1="216" y1="342" x2="205" y2="274"/>
        <line x1="258" y1="342" x2="272" y2="274"/>
        <line x1="194" y1="356" x2="166" y2="330"/>
        <line x1="282" y1="349" x2="308" y2="326"/>
        <line x1="289" y1="365" x2="316" y2="350"/>
      </g>
      <ellipse cx="239" cy="354" rx="65" ry="48" fill="#f4c89e" stroke="#d79f72" stroke-width="2"/>
    </g>

    <!-- Dedos señalados -->
    <line x1="113" y1="265" x2="202" y2="274" stroke="#c25a4c" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="205" cy="274" r="3.5" fill="#c25a4c"/>
    <text x="108" y="260" text-anchor="end" font-size="14" font-weight="700" fill="#a8321f">índice</text>
    <line x1="321" y1="265" x2="275" y2="274" stroke="#c25a4c" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="272" cy="274" r="3.5" fill="#c25a4c"/>
    <text x="326" y="260" font-size="14" font-weight="700" fill="#a8321f">corazón</text>
  </g>

  <text x="254" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b52">botón izquierdo</text>
  <text x="382" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a00">botón derecho</text>

  <!-- Tarjeta 2: el puntero -->
  <rect x="580" y="32" width="288" height="496" rx="18" fill="#ffffff" stroke="#b7c9c3" stroke-width="1.5" filter="url(#rat-sombra)"/>
  <circle cx="616" cy="76" r="16" fill="#e8f5f0" stroke="#c9e7dc" stroke-width="1.5"/>
  <text x="616" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b52">2</text>
  <text x="644" y="83" font-size="22" font-weight="700" fill="#173b34">El puntero</text>

  <!-- Puntero en grande -->
  <circle cx="724" cy="242" r="94" fill="#e8f5f0" stroke="#c9e7dc" stroke-width="1.5"/>
  <g transform="translate(684 178) scale(4)">
    <path d="M0 0 L0 28 L7 21 L11 32 L16 30 L12 19 L20 19 Z" fill="#ffffff" stroke="#0f1f1e" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Mini pantalla con el puntero -->
  <rect x="610" y="352" width="228" height="140" rx="10" fill="#ffffff" stroke="#b7c9c3" stroke-width="1.5" filter="url(#rat-sombra-fina)"/>
  <path d="M610 362 a10 10 0 0 1 10 -10 h208 a10 10 0 0 1 10 10 v14 h-228 z" fill="#eef2f1"/>
  <line x1="610" y1="376" x2="838" y2="376" stroke="#ccd6d4" stroke-width="1.2"/>
  <circle cx="626" cy="364" r="3.5" fill="#b7c9c3"/>
  <circle cx="638" cy="364" r="3.5" fill="#b7c9c3"/>
  <circle cx="650" cy="364" r="3.5" fill="#b7c9c3"/>
  <rect x="634" y="400" width="42" height="54" rx="6" fill="#e5f1ec" stroke="#b7c9c3" stroke-width="1.2"/>
  <g transform="translate(676 402) scale(1.4)">
    <path d="M0 0 L0 28 L7 21 L11 32 L16 30 L12 19 L20 19 Z" fill="#ffffff" stroke="#0f1f1e" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <rect x="742" y="400" width="76" height="10" rx="5" fill="#eef2f1"/>
  <rect x="742" y="418" width="56" height="10" rx="5" fill="#eef2f1"/>
  <rect x="742" y="436" width="64" height="10" rx="5" fill="#eef2f1"/>
</svg>
